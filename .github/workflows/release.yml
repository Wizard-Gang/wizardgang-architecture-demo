name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Exact annotated semantic tag cut from successful main CI
        required: true
        type: string
      commit:
        description: Exact accepted main commit identified by the tag
        required: true
        type: string
      ci_run_id:
        description: Successful exact-commit main CI run
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use committed npm version
        run: npm install --global npm@12.1.0
      - name: Verify pinned Node/npm toolchain
        run: node scripts/validate-toolchain.ts
      - name: Install locked dependencies
        run: npm ci
      - name: Reproduce the tagged state
        run: |
          local_d1_dir="$(mktemp -d)"
          trap 'rm -rf -- "$local_d1_dir"' EXIT
          export WG_LOCAL_D1_PERSIST_TO="$local_d1_dir"
          npm run check
          unset WG_LOCAL_D1_PERSIST_TO
          npm run security:dependency-advisories
      - name: Verify annotated semantic release identity
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
          SOURCE_CI_RUN_ID: ${{ inputs.ci_run_id }}
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be semantic version vMAJOR.MINOR.PATCH; got $GITHUB_REF_NAME"
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$GITHUB_REF" != "refs/tags/$GITHUB_REF_NAME" ]]; then
              echo "::error::Tag-push Release lost its exact tag ref"
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REQUESTED_TAG" != "$GITHUB_REF_NAME" || "$GITHUB_REF" != "refs/tags/$REQUESTED_TAG" || ! "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ || ! "$SOURCE_CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Exact-tag Release dispatch inputs do not match its tag ref"
              exit 1
            fi
            ci_line="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID" --jq '[.name, .event, .head_branch, .head_sha, .status, .conclusion] | @tsv')"
            IFS=$'\t' read -r ci_name ci_event ci_branch ci_commit ci_status ci_conclusion <<< "$ci_line"
            main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            if [[ "$ci_name" != "CI" || "$ci_event" != "push" || "$ci_branch" != "main" || "$ci_commit" != "$REQUESTED_COMMIT" || "$ci_status" != "completed" || "$ci_conclusion" != "success" || "$main_sha" != "$REQUESTED_COMMIT" ]]; then
              echo "::error::Exact-tag Release dispatch is not bound to successful current-main CI"
              exit 1
            fi
          else
            echo "::error::Unsupported Release event: $GITHUB_EVENT_NAME"
            exit 1
          fi

          tag_ref="refs/tags/$GITHUB_REF_NAME"
          git fetch --force --no-tags origin "$tag_ref:$tag_ref"
          if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
            echo "::error::$GITHUB_REF_NAME is not an annotated tag"
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          checkout_commit="$(git rev-parse HEAD)"
          if [[ "$checkout_commit" != "$tag_commit" ]]; then
            echo "::error::Checked-out commit $checkout_commit does not match tagged commit $tag_commit"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$checkout_commit" != "$REQUESTED_COMMIT" ]]; then
            echo "::error::Release dispatch commit does not match the annotated tag"
            exit 1
          fi

          ci_json='null'
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            ci_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID")"
          fi
          RELEASE_CI_JSON="$ci_json" RELEASE_MAIN_SHA="${main_sha:-}" RELEASE_CHECKOUT_COMMIT="$checkout_commit" node scripts/release-workflow.ts validate-dispatch

          package_version="$(node scripts/release-workflow.ts package-version < package.json)"
          if [[ "v$package_version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Package version $package_version does not match release tag $GITHUB_REF_NAME"
            exit 1
          fi

          tag_date="$(TZ=UTC git for-each-ref --format='%(taggerdate:iso8601-strict)' "$tag_ref")"
          previous_tag=''
          search_commit="$tag_commit^"
          while true; do
            candidate="$(git describe --tags --abbrev=0 "$search_commit" --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
            [[ -n "$candidate" ]] || break
            if release_state="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$candidate" --jq '[.draft, .published_at, .tag_name] | @tsv' 2>&1)"; then
              IFS=$'\t' read -r draft published release_tag <<< "$release_state"
              if [[ "$draft" == 'false' && "$published" != 'null' && "$release_tag" == "$candidate" ]]; then
                previous_tag="$candidate"
                break
              fi
            elif [[ "$release_state" != *'HTTP 404'* ]]; then
              echo "::error::Unable to inspect prior Release $candidate"
              exit 1
            fi
            search_commit="$(git rev-list -n 1 "$candidate")^"
          done

          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "tag_date=$tag_date" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release from tag and GitHub history
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ steps.release.outputs.tag_commit }}
          TAG_DATE: ${{ steps.release.outputs.tag_date }}
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
        shell: bash
        run: |
          previous_display="${PREVIOUS_TAG:-none}"
          release_context="$(printf '## Release identity\n\n- Annotated tag: `%s`\n- Commit: `%s`\n- Annotated tag date (UTC): `%s`\n- Previous release tag: `%s`\n\nRelease changes are generated from GitHub history. The GitHub Release and annotated tag are the historical release authority.\n' "$GITHUB_REF_NAME" "$TAG_COMMIT" "$TAG_DATE" "$previous_display")"

          release_args=(
            "$GITHUB_REF_NAME"
            --title "WizardGang Architecture Demo $GITHUB_REF_NAME"
            --notes "$release_context"
            --generate-notes
            --verify-tag
          )
          if [[ -n "$PREVIOUS_TAG" ]]; then
            release_args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi

          published_tag="$(gh release view "$GITHUB_REF_NAME" --json isDraft,tagName,publishedAt --jq 'if .isDraft == false and .publishedAt != null then .tagName else "" end' 2>/dev/null || true)"
          if [[ "$published_tag" == "$GITHUB_REF_NAME" ]]; then
            echo "Published $GITHUB_REF_NAME already exists; retained its release identity."
          else
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "::error::A non-published Release already exists for $GITHUB_REF_NAME"
              exit 1
            fi
            gh release create "${release_args[@]}"
          fi

  deploy:
    needs: reproduce
    permissions:
      actions: read
      contents: read
    uses: Wizard-Gang/baseline/.github/workflows/deploy-worker.yml@1493de4ae8b1f43f23559b210d047a288b00fcf1
    with:
      worker: demo
      tag: ${{ github.ref_name }}
      expected_sha: ${{ github.sha }}
    secrets: inherit

  # Record-only: re-running failed jobs re-runs just this job against the retained deploy result, never a redeploy.
  record:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Record the verified deployment result on the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_RESULT: ${{ needs.deploy.outputs.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_RESULT" || "$DEPLOY_RESULT" == *$'\n'* || ${#DEPLOY_RESULT} -gt 1024 ]]; then
            echo "::error::Deploy result is missing or not one bounded line; the deployment is not recorded as verified"
            exit 1
          fi
          # Exactly the baseline result fields, bound to this run, tag and commit; anything else is refused.
          if ! jq -e --arg repository "$GITHUB_REPOSITORY" --arg tag "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" '
              type == "object"
              and (keys == (["schema", "worker", "host", "repository", "run_id", "run_attempt", "tag", "commit", "observed_at",
                "worker_version_id", "traffic_percentage", "assets_checked", "checks"] | sort))
              and .schema == 1 and .worker == "demo" and .host == "demo.wizardgang.ai"
              and .repository == $repository and .run_id == $run_id and .tag == $tag and .commit == $commit
              and (.run_attempt | type == "number" and . == floor and . >= 1 and . <= $run_attempt)
              and (.observed_at | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{3}Z$"))
              and (.worker_version_id | type == "string" and test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"))
              and .traffic_percentage == 100
              and (.assets_checked | type == "number" and . == floor and . >= 0 and . <= 20)
              and (.checks | type == "object" and keys == (["reproduction", "traffic", "version", "health", "assets"] | sort)
                and all(.[]; . == "passed"))
            ' <<< "$DEPLOY_RESULT" > /dev/null || [[ "$(jq -c . <<< "$DEPLOY_RESULT")" != "$DEPLOY_RESULT" ]]; then
            echo "::error::Deploy result is malformed, unperformed or not bound to this run, tag and commit"
            exit 1
          fi

          run_attempt="$(jq -r .run_attempt <<< "$DEPLOY_RESULT")"
          asset="deployment-$GITHUB_RUN_ID-$run_attempt.json"
          record_dir="$(mktemp -d)"
          printf '%s\n' "$DEPLOY_RESULT" > "$record_dir/$asset"
          {
            echo "## Verified deployment"
            echo
            jq -r '"- Tag: `\(.tag)`", "- Commit: `\(.commit)`", "- Host: `\(.host)`", "- Observed at (UTC): `\(.observed_at)`",
              "- Worker version: `\(.worker_version_id)` at \(.traffic_percentage)% of traffic", "- Assets checked: \(.assets_checked)",
              "- Checks: \(.checks | to_entries | map("\(.key) \(.value)") | join(", "))"' <<< "$DEPLOY_RESULT"
            echo "- Producing run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$run_attempt"
          } >> "$GITHUB_STEP_SUMMARY"

          # Matches the attached asset byte for byte, or reports why not.
          recorded() {
            local existing
            existing="$(gh release view "$GITHUB_REF_NAME" --json isDraft,assets)" || return 2
            [[ "$(jq -r .isDraft <<< "$existing")" == false ]] || return 2
            jq -e --arg asset "$asset" 'any(.assets[]; .name == $asset)' <<< "$existing" > /dev/null || return 1
            rm -f "$record_dir/attached.json"
            gh release download "$GITHUB_REF_NAME" --pattern "$asset" --output "$record_dir/attached.json" || return 2
            cmp -s "$record_dir/attached.json" "$record_dir/$asset" || return 3
          }
          incomplete() {
            echo "- Record: incomplete — $1" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Deployment verified, record incomplete: $1"
            exit 1
          }

          status=0
          recorded || status=$?
          if (( status == 1 )); then
            gh release upload "$GITHUB_REF_NAME" "$record_dir/$asset" || true
            status=0
            recorded || status=$?
          fi
          case "$status" in
            0) echo "- Record: \`$asset\` on the $GITHUB_REF_NAME Release" >> "$GITHUB_STEP_SUMMARY" ;;
            3) incomplete "the $GITHUB_REF_NAME Release already holds a different $asset; it is never replaced" ;;
            *) incomplete "$asset could not be attached to the published $GITHUB_REF_NAME Release; re-run failed jobs to retry recording only" ;;
          esac
